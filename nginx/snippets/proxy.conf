# Shared reverse-proxy settings.
#
# X-Forwarded-For is deliberately OVERWRITTEN with $remote_addr rather than
# appended to. nginx is the only trusted hop, so $remote_addr is the real client
# and the value the application reads for rate-limit bucketing cannot be forged
# with a single request header.
#
# If a CDN is ever placed in front of this, switch to
# `set_real_ip_from <cdn ranges>; real_ip_header CF-Connecting-IP;` and keep the
# overwrite here, so the last hop is still edge-controlled.
#
# X-Forwarded-Host is forwarded because Auth.js and next-intl both need the
# original host, and it was previously missing entirely.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket upgrade, used by Next.js dev HMR and nothing in production.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
