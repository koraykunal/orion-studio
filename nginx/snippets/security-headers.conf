# Shared security response headers.
#
# nginx's `add_header` uses replace-on-inherit semantics: a `location` block that
# declares ANY add_header stops inheriting the parent set. Declaring these once
# in a `server` block and adding a per-location Cache-Control therefore silently
# drops every security header. Including this snippet in every server and every
# location that sets its own headers is the fix.
#
# Keep in sync with `securityHeaders` in web/next.config.ts. Next sets the same
# values for proxied responses; the duplication is what covers /uploads/, which
# nginx serves without ever reaching the app.

add_header X-DNS-Prefetch-Control "on" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Download-Options "noopen" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
