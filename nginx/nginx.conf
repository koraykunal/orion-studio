worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # nginx:alpine ships without mime.types being included anywhere, which
    # makes every directly-served file fall back to text/html. That silently
    # breaks the uploaded MP4/WebM previews.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Uploads: the app caps at 30MB, leave headroom for multipart overhead.
    client_max_body_size 35M;
    server_tokens off;

    # Docker's embedded DNS. Without this, `proxy_pass http://web:3000` is
    # resolved once at startup and keeps pointing at a dead container IP after
    # `docker compose up` recreates the web service.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------------
    # gzip_proxied defaults to `off`, and every response on this site comes from
    # proxy_pass. Without this the gzip block below is decorative and no HTML,
    # CSS or JavaScript is ever compressed.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/rss+xml
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Shared proxy settings
    # ------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    client_body_timeout  30s;
    send_timeout         30s;
    keepalive_timeout   65s;

    # Buffer large uploads straight through instead of spooling 30MB to disk
    # per concurrent request.
    proxy_request_buffering off;

    # WebSocket upgrade map. Kept at http level so both halves of the handshake
    # resolve to "upgrade" and everything else resolves to "close", instead of
    # sending an unconditional Connection: upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------------
    # Edge rate limiting
    # ------------------------------------------------------------------------
    # Application-level limits live in the database, which makes the database
    # the amplification point for an abusive client. This caps the connection
    # rate before a request ever reaches Node or Postgres.
    limit_req_zone  $binary_remote_addr zone=api_per_ip:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth_per_ip:10m  rate=1r/s;
    limit_req_zone  $binary_remote_addr zone=page_per_ip:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ------------------------------------------------------------------------
    # TLS
    # ------------------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    # Session tickets without forward secrecy. Off, with the shared cache above.
    ssl_session_tickets       off;

    # ------------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------------
    # nginx's add_header is replace-on-inherit: a child `location` that declares
    # any add_header stops inheriting the parent set entirely. That is why these
    # live in a snippet that every server and location includes, rather than
    # once in the server block.
    # Keep in sync with securityHeaders in web/next.config.ts.
    # ------------------------------------------------------------------------

    # Page cache for anonymous GETs only.
    proxy_cache_path /var/cache/nginx/orion
                     levels=1:2
                     keys_zone=orion_pages:32m
                     max_size=512m
                     inactive=15m
                     use_temp_path=off;

    # ------------------------------------------------------------------------
    # HTTP: ACME + redirect
    # ------------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name orionstud.io www.orionstud.io orion-studio.net www.orion-studio.net;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://orionstud.io$request_uri;
        }
    }

    # Catch-all for unknown Host on port 80. Placed before the named server so
    # nginx does not implicitly promote the first block to catch-all.
    server {
        listen 80;
        server_name _;
        return 444;
    }

    # ------------------------------------------------------------------------
    # HTTPS: apex
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # Do not serve a certificate to a name we do not own.
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name orionstud.io;

        ssl_certificate     /etc/letsencrypt/live/orionstud.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orionstud.io/privkey.pem;

        include /etc/nginx/snippets/security-headers.conf;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # --------------------------------------------------------------------
        # Uploaded media
        # --------------------------------------------------------------------
        # `^~` is required. Without it, the regex location below wins for
        # /uploads/*.png because regex locations are evaluated after the longest
        # prefix match, which meant every uploaded image was served by Node
        # instead of by nginx, and the cache headers on this block never applied.
        #
        # `alias` without `try_files`: try_files probes relative to the root
        # prefix, not the alias, which double-prefixes the path and 404s files
        # that exist. nginx returns 404 by itself for a missing alias target.
        location ^~ /uploads/ {
            alias /usr/share/nginx/uploads/;

            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

            # Uploads are immutable: the filename is a UUID and content never
            # changes under the same name.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # --------------------------------------------------------------------
        # Fingerprinted build output
        # --------------------------------------------------------------------
        location ^~ /_next/static/ {
            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Next.js image optimiser output. Content-addressed, so also immutable.
        location ^~ /_next/image {
            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /favicon.ico { return 301 /icon.svg; }
        location = /robots.txt  { proxy_pass http://web:3000; include /etc/nginx/snippets/proxy.conf; }
        location = /sitemap.xml { proxy_pass http://web:3000; include /etc/nginx/snippets/proxy.conf; }

        # --------------------------------------------------------------------
        # Admin
        # --------------------------------------------------------------------
        location /admin {
            limit_conn conn_per_ip 10;
            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            # Never cached: this is authenticated, per-user HTML.
            add_header Cache-Control "no-store" always;
        }

        # --------------------------------------------------------------------
        # API
        # --------------------------------------------------------------------
        location /api/auth/ {
            # Credential stuffing defence at the edge, before Node or Postgres.
            limit_req zone=auth_per_ip burst=5 nodelay;
            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            limit_conn conn_per_ip 10;
            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
        }

        # --------------------------------------------------------------------
        # Public pages
        # --------------------------------------------------------------------
        location / {
            limit_req zone=page_per_ip burst=60 nodelay;

            proxy_pass http://web:3000;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

            proxy_cache orion_pages;
            proxy_cache_key "$scheme$host$request_uri$http_rsc$http_next_router_prefetch$http_next_router_state_tree";
            proxy_cache_valid 200 301 302 60s;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_methods GET HEAD;

            # Cache-Control and Expires are ignored from the origin because the
            # explicit header below is what clients and the edge agree on.
            # Set-Cookie is still honoured, which is what stops the first
            # visitor's locale cookie from being cached and replayed.
            proxy_ignore_headers Cache-Control Expires;

            # Never serve a cached or stored copy to an authenticated session.
            proxy_cache_bypass $http_upgrade $cookie_authjs_session_token $cookie___Secure_authjs_session_token;
            proxy_no_cache   $http_upgrade $cookie_authjs_session_token $cookie___Secure_authjs_session_token;

            add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    # ------------------------------------------------------------------------
    # HTTPS: www → apex
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name www.orionstud.io;

        ssl_certificate     /etc/letsencrypt/live/orionstud.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orionstud.io/privkey.pem;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        return 301 https://orionstud.io$request_uri;
    }

    # ------------------------------------------------------------------------
    # HTTPS: legacy domain → apex
    # ------------------------------------------------------------------------
    # This block needs a live certificate for orion-studio.net or nginx refuses
    # to start at all. If the redirect is permanent, either keep renewing that
    # certificate (see deploy.sh) or delete the block and handle the domain at
    # the registrar.
    server {
        listen 443 ssl;
        http2 on;
        server_name orion-studio.net www.orion-studio.net;

        ssl_certificate     /etc/letsencrypt/live/orion-studio.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orion-studio.net/privkey.pem;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        return 301 https://orionstud.io$request_uri;
    }
}
